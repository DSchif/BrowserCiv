<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrowserCiv</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0e1116; color: #e6edf3; font-family: system-ui, sans-serif; }
      #app-root { width: 100vw; height: 100vh; }
      #game-canvas { position: fixed; inset: 0; z-index: 0; }

      /* ── Lobby ── */
      .lobby { max-width: 720px; margin: 32px auto; padding: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
      .lobby h1 { margin-top: 0; }
      .lobby .row { display: flex; gap: 16px; align-items: center; margin: 12px 0; }
      .lobby label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      .lobby input, .lobby select { background: #0e1116; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 6px 8px; font-size: 14px; }
      .lobby button { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
      .lobby button:hover { background: #2ea043; }
      .lobby ul { list-style: none; padding: 0; }
      .lobby li { padding: 8px 12px; background: #0e1116; border: 1px solid #30363d; border-radius: 4px; margin: 6px 0; display: flex; gap: 12px; align-items: center; }
      .lobby li button { margin-left: auto; background: #1f6feb; }
      .lobby li button:hover { background: #388bfd; }
      .lobby code { background: #0e1116; padding: 2px 6px; border-radius: 3px; font-size: 12px; border: 1px solid #30363d; }
      .lobby .dim { color: #8b949e; }
      .lobby .error { color: #f85149; min-height: 1em; }

      /* ── Top bar ── */
      .top-bar {
        position: fixed; top: 0; left: 0; right: 0; height: 44px;
        background: rgba(13,17,23,0.97); border-bottom: 1px solid #30363d;
        display: flex; align-items: center; z-index: 10; padding: 0 10px; gap: 10px;
        font-size: 13px;
      }
      .tb-left { display: flex; align-items: center; gap: 8px; }
      .tb-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
      .tb-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }

      .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ea043; flex-shrink: 0; }
      .status-dot.disconnected { background: #f85149; }
      .era-badge { background: #1f6feb; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
      .match-code { color: #8b949e; font-size: 11px; font-family: monospace; }
      .tb-dim { color: #8b949e; font-size: 12px; }
      .active-badge { color: #d29922; font-weight: 600; font-size: 12px; }
      .your-turn-badge { background: #238636; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }

      .tb-btn {
        background: rgba(255,255,255,0.05); border: 1px solid #30363d; color: #e6edf3;
        padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        display: flex; align-items: center; gap: 4px; white-space: nowrap;
      }
      .tb-btn:hover { background: rgba(255,255,255,0.1); }
      .tb-science { border-color: #4493f8; color: #79c0ff; }
      .tb-science:hover { background: rgba(68,147,248,0.15); }
      .tb-gold { border-color: #9a6700; color: #f0d040; }
      .tb-gold:hover { background: rgba(210,153,34,0.15); }
      .tb-diplo { border-color: #8b3a6e; color: #d263a4; }
      .tb-diplo:hover { background: rgba(191,75,138,0.15); }
      .tb-start { background: #238636; border-color: #2ea043; color: white; font-weight: 600; padding: 4px 14px; }
      .tb-start:hover:not(:disabled) { background: #2ea043; }
      .tb-start:disabled { background: #30363d; color: #6e7681; border-color: #30363d; cursor: not-allowed; }

      /* ── Menu dropdown ── */
      .menu-dropdown {
        position: fixed; top: 48px; right: 10px;
        background: rgba(13,17,23,0.99); border: 1px solid #30363d; border-radius: 8px;
        z-index: 20; min-width: 200px; overflow: hidden;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      }
      .menu-dropdown.hidden { display: none; }
      .menu-dropdown button {
        display: block; width: 100%; background: none; border: none;
        color: #e6edf3; padding: 10px 16px; cursor: pointer; font-size: 13px;
        text-align: left; transition: background 0.1s;
      }
      .menu-dropdown button:hover { background: rgba(255,255,255,0.07); }
      .menu-leave { color: #f85149 !important; }
      .menu-divider { height: 1px; background: #30363d; margin: 2px 0; }
      .menu-players { padding: 4px 0; }
      .menu-player-row {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 16px; font-size: 12px; color: #8b949e;
      }
      .menu-res { padding: 6px 16px; font-size: 11px; color: #8b949e; }

      /* ── Log panel ── */
      .log-panel {
        position: fixed; bottom: 100px; left: 12px;
        background: rgba(13,17,23,0.96); border: 1px solid #30363d; border-radius: 6px;
        z-index: 3; width: 250px; max-height: 180px; overflow-y: auto; padding: 8px;
      }
      .log-panel.hidden { display: none; }
      .log-header { font-size: 10px; color: #8b949e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #30363d; }
      .log-panel ul { list-style: none; padding: 0; margin: 0; }
      .log-panel li { font-size: 11px; padding: 2px 0; color: #c9d1d9; }
      .log-panel li code { background: #0e1116; padding: 0 4px; border-radius: 2px; font-size: 10px; color: #8b949e; }

      /* ── Tile info (bottom-left) ── */
      .tile-info { position: fixed; bottom: 12px; left: 12px; background: rgba(13,17,23,0.96); border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; z-index: 3; font-size: 12px; min-width: 180px; max-width: 240px; pointer-events: none; }
      .tile-info.hidden { display: none; }
      .tile-info .ti-row { margin: 2px 0; }
      .tile-info .dim { color: #8b949e; font-size: 11px; }
      .tile-info .ti-y { display: inline-block; padding: 1px 5px; margin-right: 3px; background: #0e1116; border-radius: 3px; font-family: monospace; font-size: 10px; }
      .tile-info .ti-y.food { color: #8be97a; }
      .tile-info .ti-y.production { color: #d29922; }
      .tile-info .ti-y.gold { color: #f0d040; }
      .tile-info .ti-y.science { color: #58a6ff; }
      .tile-info .ti-y.culture { color: #c084fc; }
      .tile-info .ti-tag { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 10px; margin-left: 4px; }
      .tile-info .ti-tag.ok { background: #1f6feb; color: white; }
      .tile-info .ti-tag.warn { background: #d29922; color: #0e1116; }

      /* ── Action panel (bottom-center, context for selected unit/city) ── */
      .action-panel {
        position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
        background: rgba(13,17,23,0.97); border: 1px solid #30363d; border-radius: 8px;
        z-index: 5; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px;
        min-width: 300px; max-width: 520px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      }
      .action-panel.hidden { display: none; }
      .ap-info { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
      .ap-unit-name { font-weight: 700; color: #e6edf3; }
      .ap-stat { color: #8b949e; font-size: 12px; }
      .ap-stat.mp-full { color: #7ee787; }
      .ap-stat.mp-low { color: #d29922; }
      .ap-stat.mp-none { color: #f85149; }
      .ap-hint { font-size: 12px; color: #c9d1d9; }
      .ap-hint-dim { color: #6e7681 !important; }
      .ap-actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .ap-actions button {
        background: #21262d; border: 1px solid #30363d; color: #e6edf3;
        padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
      }
      .ap-actions button:hover:not(:disabled) { background: #30363d; }
      .ap-actions button:disabled { opacity: 0.35; cursor: not-allowed; }
      .ap-actions button.ap-primary { background: #1a4731; border-color: #2ea043; color: #7ee787; }
      .ap-actions button.ap-primary:hover:not(:disabled) { background: #1f5c3e; }
      .ap-actions button.ap-yellow { background: #3a2a00; border-color: #d29922; color: #f0d040; }
      .ap-actions button.ap-yellow:hover:not(:disabled) { background: #4a3500; }
      .ap-actions button.ap-attack-btn { background: #3a1010; border-color: #8b2020; color: #ff7b72; }
      .ap-actions button.ap-attack-btn:hover:not(:disabled) { background: #4a1818; border-color: #f85149; }

      /* ── Attack picker ── */
      .attack-picker {
        position: fixed; bottom: 190px; left: 50%; transform: translateX(-50%);
        background: rgba(13,17,23,0.99); border: 1px solid #d29922; border-radius: 8px;
        padding: 8px; z-index: 6; display: flex; flex-direction: column; gap: 4px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.7);
      }
      .attack-picker.hidden { display: none; }
      .attack-picker .ap-title { color: #d29922; font-weight: bold; padding: 2px 8px; font-size: 12px; }
      .attack-picker .ap-btn { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 12px; background: #1f6feb; color: white; border: none; border-radius: 4px; cursor: pointer; min-width: 220px; text-align: left; }
      .attack-picker .ap-btn:hover { background: #388bfd; }
      .attack-picker .ap-btn span { font-size: 11px; color: #c9d1d9; opacity: 0.85; }
      .attack-picker .ap-cancel { background: #30363d; color: #8b949e; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }

      /* ── End turn (bottom-right) ── */
      .end-turn-btn {
        position: fixed; bottom: 20px; right: 20px;
        background: #238636; color: white; border: none; padding: 12px 28px;
        border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 700;
        z-index: 5; letter-spacing: 0.3px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
      .end-turn-btn:hover:not(:disabled) { background: #2ea043; }
      .end-turn-btn:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; box-shadow: none; }

      /* ── City / tech / diplo panels (right-side overlays) ── */
      .city-panel { position: fixed; top: 56px; right: 12px; width: 320px; max-height: calc(100vh - 68px); overflow-y: auto; background: rgba(13,17,23,0.97); border: 1px solid #30363d; border-radius: 8px; z-index: 8; padding: 12px; font-size: 13px; }
      .city-panel.hidden { display: none; }
      .city-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .city-panel h2 { margin: 0; font-size: 16px; }
      .city-panel #cp-close, .city-panel #tp-close, .city-panel #dp-close { background: transparent; color: #8b949e; border: none; font-size: 24px; cursor: pointer; padding: 0 6px; }
      .city-panel .cp-row { margin: 6px 0; }
      .city-panel strong { color: #8b949e; font-weight: 500; margin-right: 4px; }
      .city-panel .yield { display: inline-block; margin-right: 6px; padding: 1px 6px; background: #0e1116; border-radius: 3px; font-family: monospace; font-size: 11px; }
      .city-panel .dim { color: #8b949e; }
      .city-panel .cp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .city-panel button.cp-build { background: #1f6feb; color: white; border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; text-align: left; }
      .city-panel button.cp-build:hover:not(:disabled) { background: #388bfd; }
      .city-panel button.cp-build:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
      .city-panel button.cp-clear { background: #6e7681; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .city-panel button.cp-clear:disabled { background: #30363d; color: #8b949e; }
      .city-panel button.cp-build.current { background: #d29922; color: #0e1116; }

      #tech-panel { width: 70vw; max-width: 1100px; }
      .tech-tree-scroll { overflow-x: auto; overflow-y: auto; max-height: 70vh; border: 1px solid #30363d; border-radius: 4px; background: #0a0d12; }
      .tech-tree-canvas { position: relative; }
      .tech-tree-svg { position: absolute; top: 0; left: 0; pointer-events: none; }
      .tech-tree-svg path { fill: none; stroke: #444; stroke-width: 1.5; }
      .tech-era-header { position: absolute; top: 8px; padding: 4px 8px; background: #161b22; color: #8b949e; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; border-radius: 3px; text-align: center; }
      .tech-box { position: absolute; padding: 6px 8px; border: 2px solid #30363d; border-radius: 4px; cursor: pointer; text-align: left; font-size: 12px; background: #21262d; color: #e6edf3; display: flex; flex-direction: column; gap: 2px; }
      .tech-box:hover:not(:disabled) { transform: scale(1.03); z-index: 2; }
      .tech-box:disabled { cursor: not-allowed; }
      .tech-box-name { font-weight: bold; font-size: 12px; line-height: 1.1; }
      .tech-box-cost { font-size: 10px; opacity: 0.8; font-family: monospace; }
      .tech-box-unlocks { font-size: 10px; opacity: 0.7; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tech-box.tech-locked { background: #1a1d22; color: #6e7681; border-color: #30363d; opacity: 0.6; }
      .tech-box.tech-available { background: #3a2a08; color: #f0b837; border-color: #d29922; }
      .tech-box.tech-current { background: #0a3050; color: #79c0ff; border-color: #4493f8; }
      .tech-box.tech-researched { background: #0f3a1f; color: #7ee787; border-color: #2ea043; }
      .tech-progress-bar { position: absolute; bottom: 4px; left: 8px; right: 8px; height: 3px; background: #000; border-radius: 2px; overflow: hidden; }
      .tech-progress-fill { height: 100%; background: #79c0ff; }

      #diplo-panel { left: auto; right: 12px; top: 56px; }
      .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
      .tag { background: #1f6feb; color: white; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
      .tag-active { background: #d29922; color: black; }

      /* ── Lobby overlay (shown until match starts) ── */
      .lobby-overlay {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(14,17,23,0.97);
        display: flex; align-items: center; justify-content: center;
      }
      .lobby-overlay.hidden { display: none; }
      .lobby-card {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        padding: 32px 40px; min-width: 380px; max-width: 480px;
        display: flex; flex-direction: column; gap: 20px;
      }
      .lobby-card h2 { margin: 0; font-size: 22px; }
      .lobby-card .lo-subtitle { color: #8b949e; font-size: 13px; margin-top: -12px; }
      .lo-id-box { background: #0e1116; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
      .lo-id-box code { font-size: 18px; letter-spacing: 2px; color: #e6edf3; }
      .lo-id-box .lo-copy { background: none; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .lo-id-box .lo-copy:hover { background: #21262d; }
      .lo-players { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
      .lo-players li { background: #0e1116; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
      .lo-players .lo-you { color: #8b949e; font-size: 11px; }
      .lo-players .lo-host-tag { background: #1f6feb; color: white; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: auto; }
      .lo-actions { display: flex; gap: 10px; }
      .lo-actions .lo-start { flex: 1; background: #238636; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; }
      .lo-actions .lo-start:hover:not(:disabled) { background: #2ea043; }
      .lo-actions .lo-start:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
      .lo-actions .lo-leave { background: none; border: 1px solid #30363d; color: #8b949e; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .lo-actions .lo-leave:hover { background: #21262d; }
      .lo-waiting { color: #8b949e; font-size: 12px; text-align: center; }

      /* ── Auth ──────────────────────────────────────────────────────────────── */
      .auth-page { max-width: 400px; }
      .auth-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid #30363d; }
      .auth-tab { background: none; border: none; border-bottom: 2px solid transparent; color: #8b949e; padding: 8px 18px; cursor: pointer; font-size: 14px; font-weight: 500; margin-bottom: -1px; }
      .auth-tab:hover { color: #e6edf3; }
      .auth-tab.active { color: #e6edf3; border-bottom-color: #1f6feb; }
      .auth-form { display: flex; flex-direction: column; gap: 12px; }
      .auth-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      .auth-form input { background: #0e1116; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 8px 10px; font-size: 14px; }
      .auth-form input:focus { outline: none; border-color: #1f6feb; }
      .auth-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 4px; color: #8b949e; font-size: 12px; }
      .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: #30363d; }
      .btn-primary { background: #1f6feb; color: white; border: none; padding: 9px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }
      .btn-primary:hover { background: #388bfd; }
      .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; padding: 9px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; width: 100%; }
      .btn-secondary:hover { background: #30363d; }
      .btn-link { background: none; border: none; color: #1f6feb; cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
      .btn-link:hover { color: #388bfd; }
      .lobby-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
      .lobby-header h1 { margin: 0; }
      .lobby-user { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; }

      /* ── Simulation ──────────────────────────────────────────────────────── */
      .sim-page { max-width: 960px; margin: 0 auto; padding: 24px; }
      .sim-page h1 { margin-top: 0; font-size: 1.4rem; }
      .sim-nav { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
      .sim-nav-btn { background: none; border: 1px solid #30363d; color: #8b949e; padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      .sim-nav-btn:hover { background: #21262d; color: #e6edf3; }
      .sim-nav-btn.active { background: #1f6feb22; border-color: #1f6feb; color: #388bfd; }

      .sim-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
      .sim-slot { background: #0e1116; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
      .sim-slot h3 { margin: 0 0 12px; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; }
      .sim-slot label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; margin-bottom: 10px; }
      .sim-slot select, .sim-slot input[type=text], .sim-slot input[type=number] { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 5px 8px; font-size: 13px; width: 100%; }
      .sim-slot input[type=number] { width: 80px; }
      .sim-agent-file { display: flex; gap: 6px; align-items: center; }
      .sim-agent-file select { flex: 1; }

      .sim-goals { margin-top: 10px; }
      .sim-goals-title { font-size: 11px; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; display: flex; align-items: center; gap: 4px; }
      .sim-goal-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
      .sim-goal-row input[type=checkbox] { accent-color: #1f6feb; width: 14px; height: 14px; flex-shrink: 0; }
      .sim-goal-row .goal-name { width: 60px; color: #c9d1d9; }
      .sim-goal-row .goal-reward { display: flex; gap: 4px; align-items: center; flex: 1; flex-wrap: wrap; }
      .sim-goal-row .goal-reward span { font-size: 11px; color: #8b949e; }
      .sim-goal-row .goal-reward input { width: 56px; padding: 2px 5px; font-size: 11px; }

      .sim-settings-row { display: flex; gap: 20px; align-items: flex-end; margin: 16px 0; flex-wrap: wrap; }
      .sim-settings-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
      .sim-settings-row select, .sim-settings-row input { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 5px 8px; font-size: 13px; }
      .sim-settings-row input[type=number] { width: 90px; }

      .sim-start-btn { background: #238636; color: white; border: none; padding: 10px 28px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 700; margin-top: 8px; }
      .sim-start-btn:hover { background: #2ea043; }

      /* Runner layout */
      .sim-runner-root { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0e1116; }
      .sim-topbar { height: 46px; background: rgba(13,17,23,0.98); border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; padding: 0 14px; flex-shrink: 0; font-size: 12px; overflow: hidden; }
      .sim-topbar-sep { width: 1px; height: 22px; background: #30363d; flex-shrink: 0; }
      .sim-episode-badge { background: #1f6feb; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
      .sim-turn-label { color: #c9d1d9; white-space: nowrap; }
      .sim-state-label { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
      .sim-state-label.running { background: #1a4731; color: #7ee787; }
      .sim-state-label.paused  { background: #3a2a00; color: #f0d040; }
      .sim-state-label.done    { background: #161b22; color: #8b949e; }
      .sim-ctrl-btn { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .sim-ctrl-btn:hover:not(:disabled) { background: #30363d; }
      .sim-ctrl-btn.active { background: #1a4731; border-color: #2ea043; color: #7ee787; }
      .sim-ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .sim-view-select { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
      .sim-reward-label { color: #8b949e; font-size: 11px; white-space: nowrap; }
      .sim-reward-label span { color: #ffd700; }

      .sim-body { flex: 1; display: flex; overflow: hidden; }
      .sim-map-area { flex: 1; position: relative; overflow: hidden; }
      .sim-map-area canvas { position: absolute; inset: 0; }

      .sim-graph-panel { width: 300px; background: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
      .sim-graph-header { padding: 8px 12px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; font-size: 12px; }
      .sim-graph-header span { color: #8b949e; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
      .sim-add-graph-btn { background: #1f6feb; color: white; border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
      .sim-add-graph-btn:hover { background: #388bfd; }
      .sim-graph-list { flex: 1; overflow-y: auto; padding: 8px; }
      .sim-graph-widget { background: #0e1116; border: 1px solid #30363d; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
      .sgw-header { display: flex; align-items: center; margin-bottom: 5px; }
      .sgw-title { flex: 1; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.06em; }
      .sgw-btn { background: none; border: none; color: #8b949e; cursor: pointer; padding: 0 3px; font-size: 13px; line-height: 1; }
      .sgw-btn:hover { color: #e6edf3; }
      .sgw-canvas-wrap { max-height: 160px; }

      /* Modal */
      .sim-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; display: flex; align-items: center; justify-content: center; }
      .sim-modal { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; min-width: 340px; max-height: 80vh; overflow-y: auto; }
      .sim-modal h3 { margin: 0 0 14px; font-size: 14px; }
      .sim-modal-footer { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }
      .sim-modal-footer button { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; border: 1px solid #30363d; }
      .sim-modal-footer .btn-primary { background: #1f6feb; color: white; border-color: #1f6feb; font-weight: 600; }
      .sim-modal-footer .btn-primary:hover { background: #388bfd; }
      .sim-modal-footer .btn-cancel { background: none; color: #8b949e; }
      .sim-modal-footer .btn-cancel:hover { background: #21262d; }
      .sim-metric-label { font-size: 11px; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
      .sim-metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 12px; }
      .sim-metric-grid label { font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 3px 4px; border-radius: 3px; cursor: pointer; }
      .sim-metric-grid label:hover { background: #21262d; }
      .sim-metric-grid input[type=checkbox] { accent-color: #1f6feb; }
      .sim-modal input[type=text] { background: #0e1116; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 5px 8px; font-size: 13px; width: 100%; margin-bottom: 10px; }

      /* History */
      .sim-history-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
      .sim-history-table th { text-align: left; padding: 6px 10px; color: #8b949e; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #30363d; }
      .sim-history-table td { padding: 7px 10px; border-bottom: 1px solid #21262d; }
      .sim-history-table tr:hover td { background: #161b22; cursor: pointer; }
      .sim-agent-group { margin-bottom: 20px; }
      .sim-agent-group h3 { font-size: 13px; color: #388bfd; margin: 0 0 6px; }

      /* Results */
      .sim-results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .sim-results-table th { text-align: left; padding: 6px 10px; color: #8b949e; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #30363d; }
      .sim-results-table td { padding: 6px 10px; border-bottom: 1px solid #21262d; }
      .outcome-won  { color: #7ee787; font-weight: 600; }
      .outcome-lost { color: #f85149; }
      .outcome-draw { color: #8b949e; }
      .sim-summary-stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 16px 0; }
      .sim-summary-stat { display: flex; flex-direction: column; }
      .sim-summary-stat .label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
      .sim-summary-stat .value { font-size: 1.2rem; font-weight: 700; color: #ffd700; }
      .sim-active-section { margin-top: 20px; }
      .sim-active-header { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
      .sim-active-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .sim-active-table th { text-align: left; padding: 5px 10px; color: #8b949e; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid #30363d; white-space: nowrap; }
      .sim-active-table td { padding: 6px 10px; border-bottom: 1px solid #21262d; vertical-align: middle; }
      .sim-active-table tbody tr:hover { background: #161b22; }
      .sim-active-actions { display: flex; gap: 4px; flex-wrap: nowrap; }
      .asim-watch { background: #1a3a5c !important; border-color: #388bfd !important; color: #79c0ff !important; }
      .asim-watch:hover { background: #1c4170 !important; }
      .asim-stop { color: #f85149 !important; border-color: #6e2b2b !important; }
      .asim-stop:hover { background: #3d1f1f !important; }
    </style>
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
