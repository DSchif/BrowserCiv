name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate core content pack
        run: pnpm validate-content

      - name: Build client
        run: pnpm --filter @browserciv/client run build

      - name: CDK synth (skeleton)
        run: pnpm --filter @browserciv/infra run synth

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @browserciv/client run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start server (background)
        run: pnpm --filter @browserciv/server run serve > /tmp/server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/health > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start; logs:"
          cat /tmp/server.log || true
          exit 1

      - name: Protocol e2e (phase 6)
        run: node scripts/e2e-phase6.mjs

      - name: Start client preview (background)
        run: pnpm --filter @browserciv/client run preview > /tmp/client.log 2>&1 &

      - name: Wait for client
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "client up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "client failed to start; logs:"
          cat /tmp/client.log || true
          exit 1

      - name: Browser smoke
        run: node scripts/browser-smoke.mjs

      - name: Play-through
        run: node scripts/play-through.mjs

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/browserciv-shots/
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/server.log
            /tmp/client.log
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: CDK deploy
        working-directory: packages/infra
        run: pnpm exec cdk deploy BrowserCivStack --require-approval never --outputs-file /tmp/cdk-outputs.json

      - name: Package and upload agent-py to S3
        run: |
          MODEL_BUCKET=$(jq -r '.BrowserCivStack.ModelBucketName' /tmp/cdk-outputs.json)
          cd packages/agent-py
          zip -r /tmp/agent-py.zip . -x "*.pyc" -x "__pycache__/*"
          aws s3 cp /tmp/agent-py.zip "s3://${MODEL_BUCKET}/agent-py.zip"
          echo "Uploaded agent-py.zip to s3://${MODEL_BUCKET}/agent-py.zip"
